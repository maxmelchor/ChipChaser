name: Nightly Sleeper Roster Sync

on:
  schedule:
    # Runs at 06:00 UTC (1:00 AM Central) every single night
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub Actions tab

jobs:
  sync-players:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch latest Sleeper data
        run: python update_players.py

      - name: Commit and push updated players.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update players.json from Sleeper API" && git push)
