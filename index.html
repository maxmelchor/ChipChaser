  <!-- JAVASCRIPT -->
  <script>
    // -----------------------------
    // CORNERBACKS & LOOKUP
    // -----------------------------
    const cornerbacks = [
      { id: "sauce_gardner", name: "Sauce Gardner", team: "NYJ", coverageTier: "elite" },
      { id: "generic_cb", name: "Generic CB", team: "ANY", coverageTier: "average" }
    ];

    const cornersById = Object.fromEntries(
      cornerbacks.map(cb => [cb.id, cb])
    );

    // -----------------------------
    // RAW PLAYER DATA (rookie -> 2024)
    // -----------------------------
    const rawPlayers = [
      {
        id: "amonra",
        name: "Amon-Ra St. Brown",
        position: "WR",
        team: "DET",
        age: 25,
        currentCbId: "generic_cb",
        seasons: [
          // Example PPR totals (you can tweak with real data later)
          { year: 2021, games: 17, ppr: 227.3 },
          { year: 2022, games: 16, ppr: 267.6 },
          { year: 2023, games: 16, ppr: 329.0 },
          { year: 2024, games: 17, ppr: 310.5 }
        ],
        cbSplits: [
          // Example split vs Sauce – he's fine here
          { cbId: "sauce_gardner", games: 1, ppr: 17.0 }
        ]
      },
      {
        id: "jsn",
        name: "Jaxon Smith-Njigba",
        position: "WR",
        team: "SEA",
        age: 23,
        // This week we say he's facing Sauce
        currentCbId: "sauce_gardner",
        seasons: [
          { year: 2023, games: 17, ppr: 163.4 },
          { year: 2024, games: 17, ppr: 201.0 }
        ],
        cbSplits: [
          // Example: JSN has struggled vs Sauce historically
          { cbId: "sauce_gardner", games: 2, ppr: 16.0 } // 8 PPR/g vs Sauce
        ]
      },
      {
        id: "devonta",
        name: "DeVonta Smith",
        position: "WR",
        team: "PHI",
        age: 25,
        currentCbId: "generic_cb",
        seasons: [
          { year: 2021, games: 17, ppr: 185.6 },
          { year: 2022, games: 17, ppr: 248.4 },
          { year: 2023, games: 17, ppr: 230.6 },
          { year: 2024, games: 17, ppr: 240.0 }
        ],
        cbSplits: []
      }
    ];

    // -----------------------------
    // PROJECTION ENGINE (2025 PPR)
    // -----------------------------
    function projectPpr2025Base(player) {
      const seasons = [...player.seasons].sort((a, b) => a.year - b.year);
      const n = seasons.length;
      const recent = seasons[n - 1];
      const prev   = seasons[n - 2];
      const prev2  = seasons[n - 3];

      const ppg = (s) => s ? (s.ppr / s.games) : null;

      const ppgRecent = ppg(recent) ?? 0;
      const ppgPrev   = ppg(prev)   ?? ppgRecent;
      const ppgPrev2  = ppg(prev2)  ?? ppgPrev;

      // Weighted average: most recent seasons matter more
      let basePpg =
        0.6 * ppgRecent +
        0.3 * ppgPrev +
        0.1 * ppgPrev2;

      // Age curve: simple version
      if (player.age <= 25) {
        basePpg *= 1.05;      // young & ascending
      } else if (player.age >= 29) {
        basePpg *= 0.95;      // gentle decline
      }

      const seasonPpr = basePpg * 17; // assume 17 games for 2025

      return { basePpg, seasonPpr };
    }

    function adjustForCorner(basePpg, player) {
      const cbId = player.currentCbId;
      if (!cbId) return basePpg;

      const cb = cornersById[cbId];
      let adjPpg = basePpg;

      // 1) Generic coverage tier adjustment
      if (cb) {
        if (cb.coverageTier === "elite") {
          adjPpg *= 0.90;
        } else if (cb.coverageTier === "good") {
          adjPpg *= 0.95;
        } else if (cb.coverageTier === "bad") {
          adjPpg *= 1.05;
        }
        // "average" → no change
      }

      // 2) WR vs CB specific splits (if enough games)
      const split = (player.cbSplits || []).find(s => s.cbId === cbId);
      if (split && split.games >= 2) {
        const splitPpg = split.ppr / split.games;
        // Blend in a bit of history so we don't overfit
        adjPpg = 0.8 * adjPpg + 0.2 * splitPpg;
      }

      return adjPpg;
    }

    // Build the players array used by the UI
    const players = rawPlayers.map((p) => {
      const base = projectPpr2025Base(p);
      const vsCbPpg = adjustForCorner(base.basePpg, p);

      return {
        id: p.id,
        name: p.name,
        position: p.position,
        team: p.team,
        age: p.age,
        // This is what drives sit/start decisions
        projected: Number(vsCbPpg.toFixed(1)),       // 2025 PPR per game vs this CB
        projectedBasePpg: Number(base.basePpg.toFixed(1)),  // 2025 neutral PPG
        projectedSeason: Number(base.seasonPpr.toFixed(1)), // 2025 full season
        matchupCbId: p.currentCbId
      };
    });

    // -----------------------------
    // HELPERS & UI WIRING
    // -----------------------------
    function getPlayer(id){
      return players.find(p => p.id === id);
    }

    function comparePlayers(a,b){
      if(!a || !b || a.id === b.id) return null;

      // Higher projected PPG vs matchup wins
      return a.projected > b.projected
        ? { start:a, sit:b, reason:`Chip says start ${a.name} — better 2025 PPR vs this matchup.` }
        : { start:b, sit:a, reason:`Chip says start ${b.name} — better 2025 PPR vs this matchup.` };
    }

    function populatePlayerSelects(){
      const A = document.getElementById("playerA");
      const B = document.getElementById("playerB");
      players.forEach((p,i)=>{
        const o1 = document.createElement("option");
        o1.value = p.id;
        o1.textContent = `${p.name} (${p.position} • ${p.team})`;
        if(i === 0) o1.selected = true;

        const o2 = document.createElement("option");
        o2.value = p.id;
        o2.textContent = `${p.name} (${p.position} • ${p.team})`;
        if(i === 1) o2.selected = true;

        A.appendChild(o1);
        B.appendChild(o2);
      });
    }

    function renderMatchups(a,b){
      const el = document.getElementById("matchupGrid");
      if(!a || !b || a.id === b.id){
        el.textContent = "Pick two players.";
        return;
      }

      const cbName = (p) => {
        const cb = cornersById[p.matchupCbId];
        return cb ? cb.name : "Unknown CB";
      };

      el.innerHTML = `
        <div style="margin-bottom:8px;">
          <strong>${a.name}</strong><br>
          Base: ${a.projectedBasePpg} PPR/g → vs ${cbName(a)}: <strong>${a.projected}</strong> PPR/g
        </div>
        <div>
          <strong>${b.name}</strong><br>
          Base: ${b.projectedBasePpg} PPR/g → vs ${cbName(b)}: <strong>${b.projected}</strong> PPR/g
        </div>
      `;
    }

    // -----------------------------
    // INIT
    // -----------------------------
    document.addEventListener("DOMContentLoaded", () => {

      populatePlayerSelects();

      const A = document.getElementById("playerA");
      const B = document.getElementById("playerB");
      const btn = document.getElementById("sitStartBtn");
      const result = document.getElementById("sitStartResult");
      const playerArt = document.getElementById("playerArt");
      const playerArtMeta = document.getElementById("playerArtMeta");

      function recompute(){
        const a = getPlayer(A.value);
        const b = getPlayer(B.value);
        const r = comparePlayers(a,b);

        if(!r){
          result.textContent = "Pick two players and Chip will decide.";
          renderMatchups(a,b);
          playerArt.src = "chip-thinking.png";
          playerArt.alt = "Chip thinking";
          playerArtMeta.textContent = "Chip will show who you should start here.";
          return;
        }

        result.textContent = r.reason;
        renderMatchups(a,b);

        const startPlayer = r.start;
        // Try to load a per-player image like player-amonra.png; fall back to Chip thinking
        playerArt.src = `player-${startPlayer.id}.png`;
        playerArt.alt = `${startPlayer.name} portrait`;
        playerArt.onerror = function(){
          this.onerror = null;
          this.src = "chip-thinking.png";
          this.alt = "Chip thinking";
        };

        playerArtMeta.innerHTML = `
          <div><strong>${startPlayer.name}</strong></div>
          <div>${startPlayer.position} • ${startPlayer.team}</div>
          <div style="margin-top:4px;">
            2025 projection vs matchup: ${startPlayer.projected} PPR/g
          </div>
        `;
      }

      A.addEventListener("change", recompute);
      B.addEventListener("change", recompute);
      btn.addEventListener("click", recompute);

      // Initial render
      recompute();

      // CHAT PANEL LOGIC
      document.getElementById("chatChipBtn").addEventListener("click", () => {
        document.getElementById("chipChatPanel").style.right = "0";
      });

      document.getElementById("closeChipChat").addEventListener("click", () => {
        document.getElementById("chipChatPanel").style.right = "-380px";
      });

    });
  </script>
